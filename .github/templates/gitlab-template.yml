spec:
  inputs:
    hub-host:
      type: string
      description: Lunar Hub hostname, without a scheme or path.
---
.lunar-tracer:
  variables:
    LUNAR_HUB_HOST: "$[[ inputs.hub-host ]]"
    LUNAR_CLI_VERSION: "${LUNAR_VERSION}"
  id_tokens:
    LUNAR_HUB_TOKEN:
      aud: "$[[ inputs.hub-host ]]"
  before_script:
    - |
      lunar_cli_cache_root="${XDG_CACHE_HOME:-${HOME:+$HOME/.cache}}"
      lunar_cli_dir="$lunar_cli_cache_root/lunar-ci-tracer/${LUNAR_CLI_VERSION:-}"
      lunar_cli_stage=
      if case "$lunar_cli_cache_root" in /*) true ;; *) false ;; esac &&
        case "${LUNAR_CLI_VERSION:-}" in ""|.|..|*[!A-Za-z0-9._-]*) false ;; *) true ;; esac &&
        mkdir -p "$lunar_cli_dir" &&
        {
          [ -x "$lunar_cli_dir/lunar" ] || {
            lunar_cli_stage="$(mktemp "$lunar_cli_dir/.lunar.XXXXXX")" &&
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/earthly/lunar-dist/releases/download/${LUNAR_CLI_VERSION}/lunar-linux-amd64" \
              --output "$lunar_cli_stage" &&
            chmod +x "$lunar_cli_stage" &&
            mv -f "$lunar_cli_stage" "$lunar_cli_dir/lunar"
          }
        } &&
        export PATH="$lunar_cli_dir:$PATH" &&
        lunar ci-tracer run --ci-type gitlab; then
        :
      else
        if [ -n "$lunar_cli_stage" ]; then rm -f "$lunar_cli_stage" || true; fi
        lunar_strict_mode="${LUNAR_STRICT_MODE:-}"
        lunar_strict_mode="${lunar_strict_mode#"${lunar_strict_mode%%[![:space:]]*}"}"
        lunar_strict_mode="${lunar_strict_mode%"${lunar_strict_mode##*[![:space:]]}"}"
        case "$lunar_strict_mode" in
          1|[Tt]|[Tt][Rr][Uu][Ee])
            echo "Lunar CI tracer setup failed; strict mode is enabled." >&2
            exit 1 ;;
        esac
        echo "WARNING: Lunar CI tracer setup failed; continuing without instrumentation." >&2
      fi
