spec:
  inputs:
    hub-host:
      type: string
      description: Lunar Hub hostname, without a scheme or path.
---
.lunar-tracer:
  variables:
    LUNAR_HUB_HOST: "$[[ inputs.hub-host ]]"
    LUNAR_CLI_VERSION: "${LUNAR_VERSION}"
  id_tokens:
    LUNAR_HUB_TOKEN:
      aud: "$[[ inputs.hub-host ]]"
  before_script:
    - |
      if LUNAR_BIN_DIR="$(mktemp -d /tmp/lunar-ci-tracer.XXXXXX)" &&
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/earthly/lunar-dist/releases/download/${LUNAR_CLI_VERSION}/lunar-linux-amd64" \
          --output "$LUNAR_BIN_DIR/lunar" &&
        chmod +x "$LUNAR_BIN_DIR/lunar" &&
        export PATH="$LUNAR_BIN_DIR:$PATH" &&
        lunar ci-tracer run --ci-type gitlab; then
        :
      elif [ "${LUNAR_STRICT_MODE:-false}" = "true" ]; then
        echo "Lunar CI tracer setup failed; LUNAR_STRICT_MODE=true." >&2
        exit 1
      else
        echo "WARNING: Lunar CI tracer setup failed; continuing without instrumentation." >&2
      fi
