name: Lunar CI Tracer
description: >-
  Installs and run the Lunar CI Tracer to instrument GitHub Actions workflows, alongside the Lunar CLI.
inputs:
  version:
    description: Lunar CLI and tracer version to use (e.g. "v3.20.0").
    required: false
    default: v3.20.0
  github-token:
    description: >-
      Token the agent uses for the GitHub API reads it makes about its own
      repository: step attribution, and the changed-file list behind
      LUNAR_COMPONENT_INFER. Defaults to the job's own GITHUB_TOKEN, so it
      reaches no further than the job already can. Workflows that set a
      restrictive `permissions:` block need `contents: read` and
      `pull-requests: read` for these to work. Set to an empty string to pass
      no token; the agent then logs that step attribution and component
      inference are degraded and continues.
    required: false
    default: ${{ github.token }}
outputs:
  agent-installed:
    description: >-
      "true" when the agent started and became ready, "false" when the agent
      could not be installed and the step continued because LUNAR_STRICT_MODE
      was not enabled.
branding:
  icon: shield
  color: blue

runs:
  using: node24
  main: index.js
  post: index.js
  post-if: always()
